# =============================================================================
# kafka-server.properties
# Configuration for the single local Kafka broker used by this project.
#
# start_kafka.ps1 copies this file to <KAFKA_HOME>\config\local-kraft.properties
# and replaces the placeholder __KAFKA_DATA_DIR__ with the real data folder.
#
# The broker runs in KRaft mode: Kafka manages its own metadata, so there is
# no ZooKeeper. One process plays both roles (broker + controller).
# =============================================================================

# ---- Identity and roles -----------------------------------------------------
# This one process is both the broker (serves clients) and the controller
# (manages cluster metadata).
process.roles=broker,controller
# Unique id of this node. Any number works for a single-node cluster.
node.id=1
# Where controllers are found. With one node it points at this same process.
controller.quorum.bootstrap.servers=localhost:9093

# ---- Network ----------------------------------------------------------------
# PLAINTEXT  (9092): producer, consumer and command-line tools connect here.
# CONTROLLER (9093): internal metadata traffic.
# Both are bound to localhost only, so the broker is not reachable from the
# network. No TLS or authentication is configured (local demo only).
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
# Address the broker tells clients to use. Must match what clients can reach.
advertised.listeners=PLAINTEXT://localhost:9092
# Which listener carries controller traffic and which carries broker traffic.
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
# Security protocol of each listener (no encryption on either).
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# ---- Storage ----------------------------------------------------------------
# Folder for topic data and KRaft metadata. Forward slashes are required here
# even on Windows; the placeholder is filled in by start_kafka.ps1.
log.dirs=__KAFKA_DATA_DIR__

# ---- Topic defaults ---------------------------------------------------------
# Topics must be created explicitly (scripts\create_topics.ps1). A typo in a
# topic name then fails loudly instead of silently creating a new topic.
auto.create.topics.enable=false
# Default partition count for topics created without an explicit value.
num.partitions=3

# ---- Single-node replication ------------------------------------------------
# Kafka's internal topics default to 3 replicas, which a one-broker cluster
# cannot provide. These settings lower them to 1 so the broker can start and
# consumer groups can commit offsets.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# ---- Retention --------------------------------------------------------------
# Keep messages for 7 days. On Windows the broker can fail when it deletes old
# log segments (the files are still locked), so retention is kept much longer
# than any demo run; scripts\reset_kafka.ps1 clears the data between demos.
log.retention.hours=168
