# =============================================================================
# debezium-postgres.properties
# Debezium PostgreSQL CONNECTOR configuration for the CDC step.
#
# Debezium reads PostgreSQL's write-ahead log and writes one Kafka message per
# changed row to the topic   pgcdc.public.order_events .
# The CDC bridge (cdc/bridge.py) reads that topic.
#
# Started by scripts\start_connect.ps1 together with connect-standalone.properties.
#
# This file contains NO password: the login is read from environment variables
# through ${env:...}. It is safe to commit.
#
# The object names below must match sql/postgres/02_cdc_setup.sql and
# config/settings.py.
# =============================================================================

# ---- Identity ---------------------------------------------------------------
# Name of the connector inside Kafka Connect (shown by the REST interface).
name=order-events-postgres-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
# The PostgreSQL connector always uses exactly one task.
tasks.max=1

# ---- PostgreSQL connection --------------------------------------------------
database.hostname=localhost
database.port=5432
# Dedicated login with REPLICATION and SELECT on the one table; not the superuser.
database.user=${env:POSTGRES_CDC_USER}
database.password=${env:POSTGRES_CDC_PASSWORD}
# Only the project database is read. No other database on the server is touched.
database.dbname=kafka_source_db

# ---- What to capture --------------------------------------------------------
# Prefix of every topic this connector writes: <prefix>.<schema>.<table>.
topic.prefix=pgcdc
# Only the source table.
table.include.list=public.order_events

# ---- Logical decoding -------------------------------------------------------
# pgoutput is built into PostgreSQL, so nothing is installed on the server.
plugin.name=pgoutput
# Replication slot: PostgreSQL's record of how far this connector has read.
# Debezium creates it on first start.
slot.name=order_events_cdc_slot
# Publication created BY HAND in sql/postgres/02_cdc_setup.sql. It publishes
# only INSERTs, and only rows that are not part of the one-time backfill.
publication.name=order_events_cdc_pub
# disabled: Debezium must use that publication as it is and must never create
# or alter one. Otherwise it could create an unfiltered publication.
publication.autocreate.mode=disabled

# ---- Initial snapshot: NONE -------------------------------------------------
# no_data: read the table's structure only, then stream changes made from now
# on. The 300 rows already in the table are NOT read and NOT published. They
# are already in Snowflake; publishing them would duplicate them there.
# This is protection layer 1 of 4 (see README).
snapshot.mode=no_data

# ---- Operations -------------------------------------------------------------
# Do not emit updates (u), deletes (d) or truncates (t). The publication
# already withholds them; this is a second guard at the connector.
skipped.operations=u,d,t
# No empty "tombstone" message after a delete.
tombstones.on.delete=false

# ---- Data types -------------------------------------------------------------
# Send NUMERIC values as JSON numbers (as the existing producer does) instead
# of base64-encoded binary, which is Debezium's default.
decimal.handling.mode=double

# ---- Keeping the replication slot moving ------------------------------------
# On a quiet table the slot would not advance, and PostgreSQL would keep its
# log files for it. A heartbeat every 5 minutes lets the slot advance.
# Heartbeats go to their own small topic (__debezium-heartbeat.pgcdc), not to
# the table's topic, so the bridge never sees them.
heartbeat.interval.ms=300000

# ---- Topics -----------------------------------------------------------------
# The broker does not create topics automatically. The two topics this
# connector needs are created by "scripts\create_topics.ps1 -IncludeCdc".
# The settings below only define what Kafka Connect uses if it has to create
# a missing topic itself: one partition (keeps the change order), one replica
# (single broker), and no automatic deletion of old data.
topic.creation.default.replication.factor=1
topic.creation.default.partitions=1
topic.creation.default.retention.ms=-1
