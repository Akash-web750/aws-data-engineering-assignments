# =============================================================================
# connect-standalone.properties
# Kafka Connect WORKER configuration for the CDC step (standalone mode).
#
# Kafka Connect is the program that runs the Debezium connector. It ships with
# Apache Kafka (bin\windows\connect-standalone.bat), so nothing extra has to be
# installed apart from the Debezium plugin.
#
# scripts\start_connect.ps1 copies this file into the Kafka config folder and
# replaces the two placeholders:
#     __CONNECT_PLUGIN_DIR__   folder holding the Debezium plugin
#     __CONNECT_DATA_DIR__     folder holding the worker's offsets file
#
# This file contains no password. It is safe to commit.
#
# WHY STANDALONE MODE
#   Distributed mode keeps its state in three extra compacted Kafka topics.
#   On Windows, Kafka can fail when it deletes or rewrites log files, which is
#   what compaction does. Standalone mode keeps its state in one local file
#   and needs no extra topics, so it is the safer choice on this machine.
# =============================================================================

# ---- Kafka ------------------------------------------------------------------
# The existing local broker. Connect only produces to it; the broker itself is
# not reconfigured.
bootstrap.servers=localhost:9092

# ---- Message format ---------------------------------------------------------
# Write keys and values as plain JSON.
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
# schemas.enable=false: write only the data, not a copy of its schema with
# every message. The CDC bridge expects exactly this shape
# ({"before":..., "after":..., "source":..., "op":...}).
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# ---- Offsets (the worker's own checkpoint) ----------------------------------
# File where the worker remembers how far Debezium has read PostgreSQL's log.
# After a restart Debezium continues from here. Forward slashes are required.
offset.storage.file.filename=__CONNECT_DATA_DIR__/connect.offsets
# How often the position is saved (milliseconds). If the worker is killed,
# change events of at most this window are sent again (at-least-once).
offset.flush.interval.ms=10000

# ---- Plugins ----------------------------------------------------------------
# Folder containing the Debezium PostgreSQL connector (scripts\install_debezium.ps1).
plugin.path=__CONNECT_PLUGIN_DIR__

# ---- REST interface ---------------------------------------------------------
# Connect's status and control API. Bound to localhost only, so it is not
# reachable from the network. Used to read the connector's state:
#     http://localhost:8083/connectors/order-events-postgres-cdc/status
listeners=http://localhost:8083

# ---- Secrets ----------------------------------------------------------------
# Lets a connector file refer to an environment variable as ${env:NAME}
# instead of containing the value. scripts\start_connect.ps1 sets the
# variables from the git-ignored .env file before starting the worker.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
# Only variables whose name starts with POSTGRES_CDC_ can be read this way.
config.providers.env.param.allowlist.pattern=^POSTGRES_CDC_.*$
