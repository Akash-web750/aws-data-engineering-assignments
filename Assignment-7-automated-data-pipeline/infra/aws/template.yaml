AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Assignment 7 - Automated Data Pipeline (AWS side). Dedicated landing bucket,
  hourly order-generator Lambda, EventBridge schedule (state is a parameter) and the
  S3 -> SNS notification for Snowflake Snowpipe. The Snowflake S3 read role is
  created separately with the AWS CLI (infra/aws/iam/).

Parameters:
  BucketName:
    Type: String
    Description: >-
      Environment-specific bucket name, a7-orders-pipeline-<AWS_ACCOUNT_ID>.
      deploy.ps1 derives it from $env:AWS_ACCOUNT_ID. No default, so no account ID
      is stored in this template.
  LandingPrefix:
    Type: String
    Default: landing/orders/
    AllowedPattern: "^[a-z0-9/_-]+/$"
    Description: Must end with "/".
  FunctionName:
    Type: String
    Default: a7-orders-generator
  RowsPerFileMin:
    Type: Number
    Default: 80
  RowsPerFileMax:
    Type: Number
    Default: 150
  DefectRate:
    Type: String
    Default: "0.08"
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
  LandingRetentionDays:
    Type: Number
    Default: 30
    Description: Landing files expire after this many days (Snowflake keeps the loaded data).
  LogRetentionDays:
    Type: Number
    Default: 14
  # ---- Snowflake wiring. The Snowflake S3 read role (a7-snowflake-s3-access-role) is
  # ---- NOT in this stack: it is created with the AWS CLI from infra/aws/iam/*.json.
  SnowflakeSnsPrincipalArn:
    Type: String
    Default: ""
    Description: SYSTEM$GET_AWS_SNS_IAM_POLICY(...) -> Statement[0].Principal.AWS. Empty = Snowflake cannot subscribe yet.

Conditions:
  HasSnowflakeSnsPrincipal: !Not [!Equals [!Ref SnowflakeSnsPrincipalArn, ""]]

Resources:
  # ---------------------------------------------------------------- S3
  # Dedicated landing bucket (never shared with other projects, because S3
  # notification settings are bucket-wide).
  # DeletionPolicy Delete: teardown.ps1 empties it first, then deleting the stack
  # removes it. UpdateReplacePolicy Retain: if a change ever required REPLACING
  # the bucket, the old one (with its data) is kept instead of being deleted.
  OrdersBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    # S3 checks that it may publish to the topic when the notification is saved.
    DependsOn: OrdersEventsTopicPolicy
    Properties:
      BucketName: !Ref BucketName
      # Only *.csv objects under the landing prefix raise events, so other keys can
      # never trigger Snowpipe.
      NotificationConfiguration:
        TopicConfigurations:
          - Event: s3:ObjectCreated:*
            Topic: !Ref OrdersEventsTopic
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: !Ref LandingPrefix }
                  - { Name: suffix, Value: .csv }
      # Security controls:
      #   SSE-S3 (AES256) default encryption - free, transparent to Snowflake (no KMS grants).
      #   All four public-access blocks on - the bucket can never be made public.
      #   BucketOwnerEnforced - ACLs disabled; access is governed by IAM/policies only.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Cost control: landing files are only needed until Snowpipe has loaded them
      # (the data then lives in Snowflake), so they expire after LandingRetentionDays.
      # No versioning is enabled, so expiry really frees the storage.
      LifecycleConfiguration:
        Rules:
          - Id: expire-landing-files
            Status: Enabled
            Prefix: !Ref LandingPrefix
            ExpirationInDays: !Ref LandingRetentionDays
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Project, Value: assignment-7-automated-data-pipeline }

  # Deny any request not made over TLS (aws:SecureTransport = false), for every
  # principal, on the bucket and all its objects.
  OrdersBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OrdersBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt OrdersBucket.Arn
              - !Sub "${OrdersBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- SNS (S3 -> Snowpipe)
  # S3 can only notify SQS queues in its own region, and Snowflake's Snowpipe queue
  # is in ap-southeast-7. So S3 publishes to this topic in ap-south-1, and Snowflake's
  # queue subscribes to it cross-region (CREATE PIPE ... AWS_SNS_TOPIC = '<arn>').
  # Unencrypted on purpose: S3 cannot publish to a topic encrypted with the AWS-managed
  # aws/sns key. The messages carry only object keys and sizes, not data.
  OrdersEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: a7-orders-s3-events
      Tags:
        - { Key: Project, Value: assignment-7-automated-data-pipeline }

  # Least privilege on the topic:
  #   publish   - only the S3 service, only for THIS bucket (SourceArn), only from
  #               this account (SourceAccount, prevents confused-deputy use)
  #   subscribe - only Snowflake's principal, added once its ARN is known
  #               (parameter SnowflakeSnsPrincipalArn; empty = statement omitted)
  OrdersEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OrdersEventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowA7BucketToPublish
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OrdersEventsTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${BucketName}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - !If
            - HasSnowflakeSnsPrincipal
            - Sid: AllowSnowflakeSnowpipeToSubscribe
              Effect: Allow
              Principal: { AWS: !Ref SnowflakeSnsPrincipalArn }
              Action: sns:Subscribe
              Resource: !Ref OrdersEventsTopic
            - !Ref AWS::NoValue

  # ---------------------------------------------------------------- Lambda
  # Log group owned by the stack (instead of Lambda auto-creating it) so that
  # retention is enforced (cost control) and the IAM policy can target it exactly.
  # The only monitoring in AWS is these logs; no alarms are defined.
  GeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: !Ref LogRetentionDays

  # Execution role, least privilege: write-only into the landing prefix (no
  # read/list/delete, no other buckets) plus writing its own log streams. The trust
  # policy's aws:SourceAccount condition limits it to this account's Lambda service.
  GeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-landing-and-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutLandingFilesOnly
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${OrdersBucket.Arn}/${LandingPrefix}*"
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Deployed form. The cleaner "!GetAtt GeneratorLogGroup.Arn" (already ends
                # in ":*") is deferred to a dedicated Lambda-role update.
                Resource: !Sub "${GeneratorLogGroup.Arn}:*"
      Tags:
        - { Key: Project, Value: assignment-7-automated-data-pipeline }

  # Sizing: arm64 (cheaper per GB-second than x86), 128 MB and a 30 s timeout are
  # ample for one ~25 KB CSV (stdlib + runtime-provided boto3 only).
  # No reserved concurrency: new accounts can have a low concurrency limit, and the
  # schedule invokes the function only once per hour.
  GeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: Generates one hourly e-commerce order CSV into the landing bucket.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: handler.lambda_handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt GeneratorRole.Arn
      # Placeholder only: deploy.ps1 uploads the real package from lambda/order_generator/
      # with update-function-code right after the stack is created.
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              raise RuntimeError("code not deployed yet - run infra/aws/deploy.ps1")
      Environment:
        Variables:
          S3_BUCKET: !Ref OrdersBucket
          S3_LANDING_PREFIX: !Ref LandingPrefix
          ROWS_PER_FILE_MIN: !Ref RowsPerFileMin
          ROWS_PER_FILE_MAX: !Ref RowsPerFileMax
          DEFECT_RATE: !Ref DefectRate
      LoggingConfig:
        LogGroup: !Ref GeneratorLogGroup
        LogFormat: Text
      Tags:
        - { Key: Project, Value: assignment-7-automated-data-pipeline }

  # Asynchronous invocations (EventBridge Scheduler): at most one Lambda retry,
  # and events older than an hour are dropped. A retry is safe because the same
  # hour produces identical bytes at the same key.
  GeneratorAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref GeneratorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600

  # ---------------------------------------------------------------- Schedule
  # EventBridge Scheduler assumes this role to call the function; it can invoke
  # only the generator.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-generator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GeneratorFunction.Arn
      Tags:
        - { Key: Project, Value: assignment-7-automated-data-pipeline }

  # Minute 5 of every UTC hour: the previous hour is complete, so every generated
  # order_ts is already in the past. The state is a stack parameter (default
  # DISABLED) and is switched on only at go-live (deploy.ps1 -ScheduleState ENABLED).
  # FlexibleTimeWindow OFF = run on time. Input "{}" = no run_ts -> previous hour.
  HourlySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: a7-orders-hourly
      Description: Generates the previous hour's order file at 5 minutes past each hour (UTC).
      ScheduleExpression: cron(5 * * * ? *)
      ScheduleExpressionTimezone: UTC
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt GeneratorFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  BucketName:
    Value: !Ref OrdersBucket
  BucketArn:
    Value: !GetAtt OrdersBucket.Arn
  LandingUri:
    Value: !Sub "s3://${OrdersBucket}/${LandingPrefix}"
  FunctionName:
    Value: !Ref GeneratorFunction
  FunctionArn:
    Value: !GetAtt GeneratorFunction.Arn
  GeneratorRoleArn:
    Value: !GetAtt GeneratorRole.Arn
  ScheduleName:
    Value: !Ref HourlySchedule
  ScheduleState:
    Value: !Ref ScheduleState
  SnsTopicArn:
    Description: Use in CREATE PIPE ... AWS_SNS_TOPIC
    Value: !Ref OrdersEventsTopic
